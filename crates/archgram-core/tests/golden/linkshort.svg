<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1412 104" width="1412" height="104" role="img" aria-labelledby="title desc">
  <title id="title">linkshort</title>
  <desc id="desc">The API creates short links and redirects. A redirect reads the URL from the Redis cache, falls back to Postgres on a miss, adds the click to a Redis stream and returns. A worker drains the stream in batches and adds the counts to Postgres, where the stats route reads them.</desc>
  <style>
    :root { --badge: #f1f1f1; --canvas: #fbfbfb; --card: #ffffff; --card-edge: #d4d4d4; --connector: #8f8f8f; --frame: #8f8f8f; --icon-ai: #6f56ad; --icon-build: #9a5b17; --icon-client: #2a7668; --icon-core: #2f6aa8; --text: #1f1f1f; --text-muted: #646464; }
    @media (prefers-color-scheme: dark) { :root { --badge: #252525; --canvas: #111111; --card: #191919; --card-edge: #353535; --connector: #707070; --frame: #707070; --icon-ai: #aa98d6; --icon-build: #cf9d62; --icon-client: #79b6a8; --icon-core: #86acd6; --text: #ededed; --text-muted: #a8a8a8; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 14px; font-weight: 500; fill: var(--text); }
    .sub { font-size: 12px; font-weight: 400; fill: var(--text-muted); }
    .canvas { fill: var(--canvas); }
    .card { fill: var(--card); stroke: var(--card-edge); stroke-width: 1; }
    .card.external { fill: var(--canvas); stroke: var(--connector); stroke-dasharray: 5 4; }
    .badge { fill: var(--badge); }
    .icon { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon.core { stroke: var(--icon-core); }
    .icon.ai { stroke: var(--icon-ai); }
    .icon.build { stroke: var(--icon-build); }
    .icon.client { stroke: var(--icon-client); }
  </style>
  <rect class="canvas" width="1412" height="104" rx="16"/>
  <g data-node="browser">
    <rect class="card" x="24" y="24" width="184" height="56" rx="10"/>
    <rect class="badge" x="34" y="34" width="36" height="36" rx="8"/>
    <g class="icon client" transform="translate(40 40)" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8.5h18"/><circle cx="6" cy="6.3" r=".6"/><circle cx="8.2" cy="6.3" r=".6"/></g>
    <text class="title" x="80" y="57.04">Visitor</text>
  </g>
  <g data-node="api">
    <rect class="card" x="260" y="24" width="184" height="56" rx="10"/>
    <rect class="badge" x="270" y="34" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(276 40)" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/><path d="M10 12.5l-2 2 2 2M14 12.5l2 2-2 2"/></g>
    <text class="title" x="316" y="49.84">API</text>
    <text class="sub" x="316" y="64.72">FastAPI, port 8000</text>
  </g>
  <g data-node="cache">
    <rect class="card" x="496" y="24" width="184" height="56" rx="10"/>
    <rect class="badge" x="506" y="34" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(512 40)" stroke-width="1.7"><path d="M13 3L6 13.5h5L10 21l7-10.5h-5z"/></g>
    <text class="title" x="552" y="49.84">URL cache</text>
    <text class="sub" x="552" y="64.72">1-day TTL</text>
  </g>
  <g data-node="clicks">
    <rect class="card" x="732" y="24" width="184" height="56" rx="10"/>
    <rect class="badge" x="742" y="34" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(748 40)" stroke-width="1.7"><rect x="2.5" y="8" width="19" height="8" rx="4"/><path d="M9 8v8M15 8v8"/></g>
    <text class="title" x="788" y="57.04">Click stream</text>
  </g>
  <g data-node="worker">
    <rect class="card" x="968" y="24" width="184" height="56" rx="10"/>
    <rect class="badge" x="978" y="34" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(984 40)" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/><path d="M10 12.5l-2 2 2 2M14 12.5l2 2-2 2"/></g>
    <text class="title" x="1024" y="49.84">Worker</text>
    <text class="sub" x="1024" y="64.72">up to 500 per read</text>
  </g>
  <g data-node="postgres">
    <rect class="card" x="1204" y="24" width="184" height="56" rx="10"/>
    <rect class="badge" x="1214" y="34" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(1220 40)" stroke-width="1.7"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/><path d="M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/></g>
    <text class="title" x="1260" y="49.84">links</text>
    <text class="sub" x="1260" y="64.72">source of truth</text>
  </g>
</svg>
