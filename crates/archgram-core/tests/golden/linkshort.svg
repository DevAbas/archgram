<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1227 309.4" width="1227" height="309.4" role="img" aria-labelledby="title desc">
  <title id="title">linkshort</title>
  <desc id="desc">The API creates short links and redirects. A redirect reads the URL from the Redis cache, falls back to Postgres on a miss, adds the click to a Redis stream and returns. A worker drains the stream in batches and adds the counts to Postgres, where the stats route reads them.</desc>
  <style>
    :root { --badge: #f1f1f1; --canvas: #fbfbfb; --card: #ffffff; --card-edge: #d4d4d4; --connector: #8f8f8f; --frame: #8f8f8f; --icon-ai: #6f56ad; --icon-build: #9a5b17; --icon-client: #2a7668; --icon-core: #2f6aa8; --text: #1f1f1f; --text-muted: #646464; }
    @media (prefers-color-scheme: dark) { :root { --badge: #252525; --canvas: #111111; --card: #191919; --card-edge: #353535; --connector: #707070; --frame: #707070; --icon-ai: #aa98d6; --icon-build: #cf9d62; --icon-client: #79b6a8; --icon-core: #86acd6; --text: #ededed; --text-muted: #a8a8a8; } }
    @font-face { font-family: "archgram-geist"; font-weight: 400; src: url(data:font/ttf;base64,) format("truetype"); }
    @font-face { font-family: "archgram-geist"; font-weight: 500; src: url(data:font/ttf;base64,) format("truetype"); }
    text { font-family: "archgram-geist", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-kerning: none; }
    .title { font-size: 14px; font-weight: 500; fill: var(--text); }
    .sub { font-size: 12px; font-weight: 400; fill: var(--text-muted); }
    .canvas { fill: var(--canvas); }
    .card { fill: var(--card); stroke: var(--card-edge); stroke-width: 1; }
    .card.external { fill: var(--canvas); stroke: var(--connector); stroke-dasharray: 5 4; }
    .badge { fill: var(--badge); }
    .logo { fill: var(--text-muted); }
    .logo-icon.core { fill: var(--icon-core); }
    .logo-icon.ai { fill: var(--icon-ai); }
    .logo-icon.build { fill: var(--icon-build); }
    .logo-icon.client { fill: var(--icon-client); }
    .logo-chip { fill: var(--card); stroke: var(--card-edge); stroke-width: 1; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1.1; stroke-dasharray: 6 5; }
    .frame-label { font-size: 11px; font-weight: 500; letter-spacing: 0.88px; fill: var(--text-muted); }
    .label-patch { fill: var(--canvas); }
    .edge { fill: none; stroke: var(--connector); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .edge.dashed { stroke-dasharray: 4 4; }
    .arrowhead { fill: none; stroke: var(--connector); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon.core { stroke: var(--icon-core); }
    .icon.ai { stroke: var(--icon-ai); }
    .icon.build { stroke: var(--icon-build); }
    .icon.client { stroke: var(--icon-client); }
    .swatch { fill: none; stroke-width: 1.7; }
    .swatch.core { stroke: var(--icon-core); }
    .swatch.ai { stroke: var(--icon-ai); }
    .swatch.build { stroke: var(--icon-build); }
    .swatch.client { stroke: var(--icon-client); }
    .legend-text { font-size: 12px; font-weight: 400; fill: var(--text-muted); }
  </style>
  <rect class="canvas" width="1227" height="309.4" rx="16"/>
  <defs><marker id="arrow" viewBox="0 0 7 12" refX="7" refY="6" markerWidth="7" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse" overflow="visible"><path class="arrowhead" d="M0 0L7 6L0 12"/></marker></defs>
  <g class="frames">
    <rect class="frame" x="506.5" y="43.5" width="228" height="200" rx="14"/>
  </g>
  <g class="edges">
    <path class="edge" d="M208 113 L257 113" marker-end="url(#arrow)"/>
    <path class="edge" d="M457 113 L525 113" marker-end="url(#arrow)"/>
    <path class="edge dashed" d="M457 113 L465 113 A8 8 0 0 0 473 105 L473 47 A16 16 0 0 1 489 31 L969 31 A16 16 0 0 1 985 47 L985 96.5 A15.5 15.5 0 0 0 1000.5 112 L1016 112" marker-end="url(#arrow)"/>
    <rect class="label-patch" x="843.8" y="23.8" width="62.39" height="14.4" rx="5"/>
    <text class="sub" x="875" y="35.26" text-anchor="middle">on a miss</text>
    <path class="edge" d="M457 113 L465 113 A8 8 0 0 1 473 121 L473 177 A16 16 0 0 0 489 193 L525 193" marker-end="url(#arrow)"/>
    <path class="edge" d="M712 193 L780 193" marker-end="url(#arrow)"/>
    <path class="edge" d="M967 193 L976 193 A9 9 0 0 0 985 184 L985 127.5 A15.5 15.5 0 0 1 1000.5 112 L1016 112" marker-end="url(#arrow)"/>
  </g>
  <rect class="label-patch" x="523" y="57.9" width="47.56" height="13.2"/>
  <text class="frame-label" x="528.5" y="68.41">REDIS</text>
  <g data-node="browser">
    <rect class="card" x="24.5" y="85.5" width="184" height="56" rx="10"/>
    <rect class="badge" x="34.5" y="95.5" width="36" height="36" rx="8"/>
    <g class="icon client" transform="translate(40.5 101.5)" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8.5h18"/><circle cx="6" cy="6.3" r=".6"/><circle cx="8.2" cy="6.3" r=".6"/></g>
    <text class="title" x="80.5" y="118.47">Visitor</text>
  </g>
  <g data-node="api">
    <rect class="card" x="260.5" y="85.5" width="197" height="56" rx="10"/>
    <rect class="badge" x="270.5" y="95.5" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(276.5 101.5)" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/><path d="M10 12.5l-2 2 2 2M14 12.5l2 2-2 2"/></g>
    <text class="title" x="316.5" y="111.27">API</text>
    <text class="sub" x="316.5" y="126.16">FastAPI, port 8000</text>
  </g>
  <g data-node="cache">
    <rect class="card" x="528.5" y="85.5" width="184" height="56" rx="10"/>
    <rect class="badge" x="538.5" y="95.5" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(544.5 101.5)" stroke-width="1.7"><path d="M13 3L6 13.5h5L10 21l7-10.5h-5z"/></g>
    <text class="title" x="584.5" y="111.27">URL cache</text>
    <text class="sub" x="584.5" y="126.16">1-day TTL</text>
  </g>
  <g data-node="clicks">
    <rect class="card" x="528.5" y="165.5" width="184" height="56" rx="10"/>
    <rect class="badge" x="538.5" y="175.5" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(544.5 181.5)" stroke-width="1.7"><rect x="2.5" y="8" width="19" height="8" rx="4"/><path d="M9 8v8M15 8v8"/></g>
    <text class="title" x="584.5" y="198.47">Click stream</text>
  </g>
  <g data-node="worker">
    <rect class="card" x="783.5" y="165.5" width="184" height="56" rx="10"/>
    <rect class="badge" x="793.5" y="175.5" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(799.5 181.5)" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/><path d="M10 12.5l-2 2 2 2M14 12.5l2 2-2 2"/></g>
    <text class="title" x="839.5" y="191.27">Worker</text>
    <text class="sub" x="839.5" y="206.16">up to 500 per read</text>
  </g>
  <g data-node="postgres">
    <rect class="card" x="1019.5" y="84.5" width="184" height="56" rx="10"/>
    <rect class="badge" x="1029.5" y="94.5" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(1035.5 100.5)" stroke-width="1.7"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/><path d="M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/></g>
    <text class="title" x="1075.5" y="110.27">links</text>
    <text class="sub" x="1075.5" y="125.16">source of truth</text>
  </g>
  <g class="legend">
    <rect class="swatch core" x="24.5" y="272.5" width="12" height="12" rx="3"/>
    <text class="legend-text" x="44.5" y="282.96">Core</text>
    <rect class="swatch client" x="91.09" y="272.5" width="12" height="12" rx="3"/>
    <text class="legend-text" x="111.09" y="282.96">Clients</text>
  </g>
</svg>
