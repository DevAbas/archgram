<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1176 191" width="1176" height="191" role="img" aria-labelledby="title desc">
  <title id="title">linkshort</title>
  <desc id="desc">The API creates short links and redirects. A redirect reads the URL from the Redis cache, falls back to Postgres on a miss, adds the click to a Redis stream and returns. A worker drains the stream in batches and adds the counts to Postgres, where the stats route reads them.</desc>
  <style>
    :root { --badge: #f1f1f1; --canvas: #fbfbfb; --card: #ffffff; --card-edge: #d4d4d4; --connector: #8f8f8f; --frame: #8f8f8f; --icon-ai: #6f56ad; --icon-build: #9a5b17; --icon-client: #2a7668; --icon-core: #2f6aa8; --text: #1f1f1f; --text-muted: #646464; }
    @media (prefers-color-scheme: dark) { :root { --badge: #252525; --canvas: #111111; --card: #191919; --card-edge: #353535; --connector: #707070; --frame: #707070; --icon-ai: #aa98d6; --icon-build: #cf9d62; --icon-client: #79b6a8; --icon-core: #86acd6; --text: #ededed; --text-muted: #a8a8a8; } }
    @font-face { font-family: "archgram-geist"; font-weight: 400; src: url(data:font/ttf;base64,) format("truetype"); }
    @font-face { font-family: "archgram-geist"; font-weight: 500; src: url(data:font/ttf;base64,) format("truetype"); }
    text { font-family: "archgram-geist", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-kerning: none; }
    .title { font-size: 14px; font-weight: 500; fill: var(--text); }
    .sub { font-size: 12px; font-weight: 400; fill: var(--text-muted); }
    .canvas { fill: var(--canvas); }
    .card { fill: var(--card); stroke: var(--card-edge); stroke-width: 1; }
    .card.external { fill: var(--canvas); stroke: var(--connector); stroke-dasharray: 5 4; }
    .badge { fill: var(--badge); }
    .label-patch { fill: var(--canvas); }
    .edge { fill: none; stroke: var(--connector); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .edge.dashed { stroke-dasharray: 4 4; }
    .arrowhead { fill: none; stroke: var(--connector); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon.core { stroke: var(--icon-core); }
    .icon.ai { stroke: var(--icon-ai); }
    .icon.build { stroke: var(--icon-build); }
    .icon.client { stroke: var(--icon-client); }
  </style>
  <rect class="canvas" width="1176" height="191" rx="16"/>
  <defs><marker id="arrow" viewBox="0 0 7 12" refX="7" refY="6" markerWidth="7" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse" overflow="visible"><path class="arrowhead" d="M0 0L7 6L0 12"/></marker></defs>
  <g class="edges">
    <path class="edge" d="M208 92 L257 92" marker-end="url(#arrow)"/>
    <path class="edge" d="M444 92 L457 92 A13 13 0 0 0 470 79 L470 63.5 A11.5 11.5 0 0 1 481.5 52 L493 52" marker-end="url(#arrow)"/>
    <path class="edge dashed" d="M444 92 L926 92 C942 92 942 116 958 116 L965 116" marker-end="url(#arrow)"/>
    <rect class="label-patch" x="792.8" y="84.8" width="62.39" height="14.4" rx="5"/>
    <text class="sub" x="824" y="96.26" text-anchor="middle">on a miss</text>
    <path class="edge" d="M444 92 L457 92 A13 13 0 0 1 470 105 L470 127.5 A11.5 11.5 0 0 0 481.5 139 L493 139" marker-end="url(#arrow)"/>
    <path class="edge" d="M680 139 L729 139" marker-end="url(#arrow)"/>
    <path class="edge" d="M916 139 L926 139 C942 139 942 116 958 116 L965 116" marker-end="url(#arrow)"/>
  </g>
  <g data-node="browser">
    <rect class="card" x="24.5" y="64.5" width="184" height="56" rx="10"/>
    <rect class="badge" x="34.5" y="74.5" width="36" height="36" rx="8"/>
    <g class="icon client" transform="translate(40.5 80.5)" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8.5h18"/><circle cx="6" cy="6.3" r=".6"/><circle cx="8.2" cy="6.3" r=".6"/></g>
    <text class="title" x="80.5" y="97.47">Visitor</text>
  </g>
  <g data-node="api">
    <rect class="card" x="260.5" y="64.5" width="184" height="56" rx="10"/>
    <rect class="badge" x="270.5" y="74.5" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(276.5 80.5)" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/><path d="M10 12.5l-2 2 2 2M14 12.5l2 2-2 2"/></g>
    <text class="title" x="316.5" y="90.27">API</text>
    <text class="sub" x="316.5" y="105.16">FastAPI, port 8000</text>
  </g>
  <g data-node="cache">
    <rect class="card" x="496.5" y="24.5" width="184" height="56" rx="10"/>
    <rect class="badge" x="506.5" y="34.5" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(512.5 40.5)" stroke-width="1.7"><path d="M13 3L6 13.5h5L10 21l7-10.5h-5z"/></g>
    <text class="title" x="552.5" y="50.27">URL cache</text>
    <text class="sub" x="552.5" y="65.16">1-day TTL</text>
  </g>
  <g data-node="clicks">
    <rect class="card" x="496.5" y="111.5" width="184" height="56" rx="10"/>
    <rect class="badge" x="506.5" y="121.5" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(512.5 127.5)" stroke-width="1.7"><rect x="2.5" y="8" width="19" height="8" rx="4"/><path d="M9 8v8M15 8v8"/></g>
    <text class="title" x="552.5" y="144.47">Click stream</text>
  </g>
  <g data-node="worker">
    <rect class="card" x="732.5" y="111.5" width="184" height="56" rx="10"/>
    <rect class="badge" x="742.5" y="121.5" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(748.5 127.5)" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/><path d="M10 12.5l-2 2 2 2M14 12.5l2 2-2 2"/></g>
    <text class="title" x="788.5" y="137.27">Worker</text>
    <text class="sub" x="788.5" y="152.16">up to 500 per read</text>
  </g>
  <g data-node="postgres">
    <rect class="card" x="968.5" y="88.5" width="184" height="56" rx="10"/>
    <rect class="badge" x="978.5" y="98.5" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(984.5 104.5)" stroke-width="1.7"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/><path d="M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/></g>
    <text class="title" x="1024.5" y="114.27">links</text>
    <text class="sub" x="1024.5" y="129.16">source of truth</text>
  </g>
</svg>
