# Proper names clippy would otherwise want in backticks; ".." keeps its defaults.
doc-valid-idents = ["RustSec", "TrueType", "OpenType", ".."]

# The platform's elementary functions may differ in their last digit from one
# libm to the next; archgram-core uses its own (src/math.rs) so the same spec
# gives the same bytes everywhere (ARCHITECTURE.md, Invariants).
disallowed-methods = [
  { path = "f64::powf", reason = "platform libm; use math::pow" },
  { path = "f64::powi", reason = "not correctly rounded; multiply, or use math::pow" },
  { path = "f64::exp", reason = "platform libm; use math::exp" },
  { path = "f64::exp2", reason = "platform libm; use math::exp" },
  { path = "f64::exp_m1", reason = "platform libm" },
  { path = "f64::ln", reason = "platform libm; use math::ln" },
  { path = "f64::ln_1p", reason = "platform libm" },
  { path = "f64::log", reason = "platform libm" },
  { path = "f64::log2", reason = "platform libm" },
  { path = "f64::log10", reason = "platform libm" },
  { path = "f64::sin", reason = "platform libm; use math::sin_cos_degrees" },
  { path = "f64::cos", reason = "platform libm; use math::sin_cos_degrees" },
  { path = "f64::sin_cos", reason = "platform libm; use math::sin_cos_degrees" },
  { path = "f64::tan", reason = "platform libm" },
  { path = "f64::asin", reason = "platform libm" },
  { path = "f64::acos", reason = "platform libm" },
  { path = "f64::atan", reason = "platform libm" },
  { path = "f64::atan2", reason = "platform libm" },
  { path = "f64::cbrt", reason = "platform libm; use math::pow" },
  { path = "f64::hypot", reason = "platform libm; use sqrt" },
]
