# A release (RELEASE.md): archgram built for every platform on a runner of
# that platform, each binary drawing every example, the drawings compared
# byte for byte across platforms, and the npm packages assembled, tested and
# packed. A tag `v*` starts it; running it by hand builds and packs without
# publishing. It publishes only from a tag, and only once trusted publishing
# is set up on npm (the repository variable NPM_TRUSTED_PUBLISHING); the
# packages are staged, and go public when a maintainer approves each one on
# npm with two-factor authentication.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.key }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin, exe: "" }
          - { key: darwin-x64, os: macos-15-intel, target: x86_64-apple-darwin, exe: "" }
          - { key: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, exe: "" }
          - { key: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl, exe: "" }
          - { key: win32-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, exe: ".exe" }
          - { key: win32-x64, os: windows-latest, target: x86_64-pc-windows-msvc, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the toolchain rust-toolchain.toml pins; the target
      # adds its standard library.
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --package archgram-cli --target ${{ matrix.target }}
      - name: Draw every example with this binary
        shell: bash
        run: |
          mkdir drawings
          for spec in examples/*.json; do
            target/${{ matrix.target }}/release/archgram${{ matrix.exe }} build "$spec" -o "drawings/$(basename "$spec" .json).svg"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.key }}
          path: target/${{ matrix.target }}/release/archgram${{ matrix.exe }}
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drawings-${{ matrix.key }}
          path: drawings
          if-no-files-found: error

  package:
    name: npm packages
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Every platform draws the same bytes
        run: |
          for svg in artifacts/drawings-linux-x64/*.svg; do
            name=$(basename "$svg")
            for other in artifacts/drawings-*/"$name"; do
              cmp "$svg" "$other" || { echo "$other differs from $svg"; exit 1; }
            done
          done
          echo "every platform drew the same bytes"
      - name: Put each binary where cargo xtask npm looks for it
        run: |
          place() {
            mkdir -p "target/$2/release"
            cp "artifacts/binary-$1/$3" "target/$2/release/$3"
            chmod +x "target/$2/release/$3"
          }
          place darwin-arm64 aarch64-apple-darwin archgram
          place darwin-x64 x86_64-apple-darwin archgram
          place linux-arm64 aarch64-unknown-linux-musl archgram
          place linux-x64 x86_64-unknown-linux-musl archgram
          place win32-arm64 aarch64-pc-windows-msvc archgram.exe
          place win32-x64 x86_64-pc-windows-msvc archgram.exe
      # Every package, then the launcher's tests and an install of this
      # runner's packages, where npx archgram must draw what the binary does.
      - run: cargo xtask npm --all --smoke
      - name: Pack
        run: |
          mkdir dist
          for package in target/npm/*/; do
            (cd "$package" && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          done
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: dist
      # Staged publishing needs npm 11.15.0 or later (docs.npmjs.com,
      # Staged publishing); one exact version, as Turborepo installs its own.
      - name: Install npm
        run: |
          npm install -g npm@11.15.0
          npm --version
      # Each package is staged, not published: it goes public when a
      # maintainer approves it on npm with two-factor authentication, the
      # trusted publisher being stage-only. The platform packages are staged
      # first and approved first, so the launcher never points at a version
      # that is not there yet. Provenance comes with trusted publishing.
      - name: Stage
        run: |
          for package in dist/archgram-cli-*.tgz; do
            npm stage publish "$package" --access public
          done
          npm stage publish dist/archgram-[0-9]*.tgz
