# Every week, main's dependencies against the RustSec advisory database
# (deny.toml), so an advisory published since the last change to them is
# seen. A pull request fails on one only when it touches the dependencies
# (ci.yml, Advisories). GitHub sends a failed scheduled run's notice to
# whoever last changed its cron line, and stops scheduled runs in a public
# repository after 60 days with no activity.
name: Weekly advisories

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
