# What a dependency may be (ARCHITECTURE.md, Dependencies and supply
# chain), checked by cargo-deny in CI (ci.yml, advisories.yml).

[licenses]
# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "MIT",
  # unicode-ident
  "Unicode-3.0",
  # archgram-icons: Simple Icons' logo data
  "CC0-1.0",
  # archgram-core: the embedded Geist fonts
  "OFL-1.1",
]

# Every version in Cargo.lock against the RustSec advisory database,
# cargo-deny's default. Any vulnerability fails. An unmaintained crate
# fails too, set here rather than left to the default, so a new version
# of cargo-deny cannot change it; one that cannot be replaced goes in
# `ignore`, with a `reason`.
[advisories]
unmaintained = "all"

# Every package outside the workspace comes from crates.io, the only
# registry allowed by default; any other registry or git source fails.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
